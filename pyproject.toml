[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fivewhys"
version = "0.1.0"
description = "Agent-driven root cause analysis. Ask why five times."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "刘达", email = "1036179451@qq.com" }]
keywords = [
    "agent",
    "llm",
    "aiops",
    "root-cause-analysis",
    "observability",
    "sre",
    "tool-use",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Systems Administration",
]

# ---- 运行时依赖（M0/M1 只需要这些，保持精简）----
#
# ⚠️ 约束策略（上线前审查 PRE-6）：
#   - **下界写我们真正验证过的版本**，不是想当然的低版本。
#     原先写 `litellm>=1.0` 是错的 —— 我们用到的
#     `suppress_debug_info` / `_hidden_params["response_cost"]` /
#     `acompletion(timeout=...)` 都不是 1.0 就有的。
#     声称支持一个从没跑过的版本，等于把问题留给第一个装它的人。
#   - **上界卡主版本**：允许同一主版本内的修复，但不让一次大版本升级
#     在半夜悄悄改掉行为（评测数字必须能复现）。
dependencies = [
    "litellm>=1.101,<2",      # 一个接口通 100+ 家模型，方便做模型路由对比
    "pydantic>=2.9,<3",       # 结构化输出的核心武器，不是配菜
    "pydantic-settings>=2.6,<3", # 配置与环境变量统一收口
    "typer>=0.15,<1",         # CLI
    "rich>=13.9,<16",         # 终端输出
    "python-dotenv>=1.0,<2",  # 读取 .env
]

[project.optional-dependencies]
# M2 才会用到（把 mock 系统做成真正的 HTTP 服务）
mock = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
fivewhys = "fivewhys.cli:app"

[project.urls]
Homepage = "https://github.com/lddd1026/fivewhys"
Issues = "https://github.com/lddd1026/fivewhys/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fivewhys"]

# ---------------- 工具链配置 ----------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# 排除 markdown：docs/ 里的代码示例是给人看的，注释对齐是刻意的，
# 不希望被 ruff format 重排（它会把 `# 说明` 前面的空格压缩掉）。
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
